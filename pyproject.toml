[project]
name = "insurance-fraud-detection-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LogoArlas", email = "215040571+LogoArlas@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
    "xgboost>=3.4.1",
]

[project.scripts]
insurance-fraud-detection-ml = "insurance_fraud_detection_ml:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
